[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-synologydsm-api"
version = "2.12.0"
description = "Python API for communication with Synology DSM"
authors = [
    {name="Michael Brussk (mib1185)"},
    {name="Quentin POLLET (Quentame)"},
    {name="FG van Zeelst (ProtoThis)"}
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
keywords=["synology-dsm", "synology"]
requires-python = ">=3.11"
dependencies  = ["aiohttp", "aiofiles", "awesomeversion"]

[project.urls]
Changelog = "https://github.com/mib1185/py-synologydsm-api/releases"
Repository = "https://github.com/mib1185/py-synologydsm-api"
Documentation = "https://github.com/mib1185/py-synologydsm-api#readme"

[project.scripts]
synologydsm-api = "synology_dsm.__main__:main"

[dependency-groups]
dev = [
    "black==26.10.1",
    "coverage[toml]",
    "flake8-bandit==4.1.1",
    "flake8-bugbear==26.10.27",
    "flake8-docstrings==1.7.0",
    "flake8-rst-docstrings==0.4.0",
    "flake8==7.5.0",
    "mypy==2.4.1",
    "pep8-naming==0.15.1",
    "prek==0.5.9",
    "Pygments==2.21.0",
    "pylint==4.1.3",
    "pytest-asyncio==1.4.1",
    "pytest==9.2.0",
    "reorder-python-imports==3.19.0",
    "syrupy",
    "types-aiofiles",
]

[tool.setuptools.package-data]
synology_dsm = ["py.typed", "*.py", "**/*.py"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["synology_dsm"]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.mypy]
exclude = ["tests/"]

[tool.pylint.MAIN]
ignore = ["tests"]

[tool.pylint.BASIC]
class-const-naming-style = "any"
good-names = [
    "id",
]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-public-methods",
    "too-many-positional-arguments",
    "too-many-statements",
    "too-many-return-statements",
]
