name: Tests

on:
  push:
    branches:
      - master
  pull_request: ~

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv with Python 3.14
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Restore prek cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prek-

      - name: Run prek
        run: |
          uv run prek run --all-files --show-diff-on-failure

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run pytest
        run: |
          uv run coverage run --parallel -m pytest

      - name: Upload coverage data
        if: matrix.python-version == '3.14'
        uses: "actions/upload-artifact@v7.0.2"
        with:
          include-hidden-files: true
          name: coverage-data
          path: ".coverage.*"

  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv with Python 3.14
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Download coverage data
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data

      - name: Combine coverage data and display human readable report
        run: |
          uv run coverage combine
          uv run coverage report

      - name: Create coverage report
        run: |
          uv run coverage xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.1.1

  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Set up uv with Python 3.14
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Build package
        run: |
          uv build --wheel
