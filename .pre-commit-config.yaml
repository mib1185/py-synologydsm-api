repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        stages: [pre-commit, pre-push, manual]
      - id: trailing-whitespace
        stages: [pre-commit, pre-push, manual]
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        files: ^(src|tests)/.+\.py$
        require_serial: true
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        files: ^(src|tests)/.+\.py$
        require_serial: true
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        files: ^src/.+\.py$
        args: ["-sn"]
      - id: mypy
        name: mypy
        entry: mypy
        args: ["--no-sqlite-cache"]
        language: system
        types: [python]
        files: ^src/.+\.py$
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.2.1
    hooks:
      - id: prettier
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
